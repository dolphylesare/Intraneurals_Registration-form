<!DOCTYPE html>
<html>
<head>
  <title>Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon -->
  <link rel="icon" href="logo.jpeg">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: #fff;
      padding: 30px 25px;
      border-radius: 15px;
      width: 360px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    }

    .logo-container {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-container img {
      width: 270px;
      max-width: 100%;
      height: auto;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      height: 48px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
      color: #333;
    }

    textarea { height: 80px; }

    #studentFields, #workField {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    button {
      padding: 14px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .popup-box {
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="logo-container">
    <img src="https://intraneurals.com/wp-content/uploads/2025/09/Gemini_Generated_Image_cbbaeocbbaeocbba-removebg-preview-332x110.png">
  </div>

  <form id="form">

    <select id="status" name="status" required>
      <option value="">Select Status</option>
      <option value="student">Student</option>
      <option value="graduated">Graduated</option>
      <option value="working">Working Professional</option>
    </select>

    <input type="text" name="fullname" placeholder="Full Name" required>
    <input type="email" name="email" placeholder="Email" required>
    <input type="tel" name="phone" placeholder="Phone Number">
    <textarea name="address" placeholder="Address"></textarea>

    <div id="studentFields">
      <input type="text" name="college" placeholder="College Name">
      <select name="department">
        <option value="">Department</option>
        <option>CSE</option>
        <option>IT</option>
        <option>ECE</option>
        <option>AI/ML</option>
      </select>
      <select name="year">
        <option value="">Year</option>
        <option>1st</option>
        <option>2nd</option>
        <option>3rd</option>
        <option>4th</option>
      </select>
    </div>

    <div id="workField">
      <input type="text" name="company" placeholder="Company">
      <select name="passout">
        <option value="">Passout Year</option>
        <option>2020</option>
        <option>2021</option>
        <option>2022</option>
        <option>2023</option>
        <option>2024</option>
        <option>2025</option>
      </select>
    </div>

    <button type="submit">Register</button>

  </form>
</div>

<div id="popup" class="popup">
  <div class="popup-box">
    <h3 id="popupMessage"></h3>
    <button onclick="closePopup()">OK</button>
  </div>
</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbzXar7LZYVmPgBJphFZ81lP8q_X4woq3qDDM6EjktqZdZ4LjG6LMu2FA4-ZsLjJtkEZ/exec"; // 🔥 replace here

const form = document.getElementById("form");
const status = document.getElementById("status");
const studentFields = document.getElementById("studentFields");
const workField = document.getElementById("workField");

status.addEventListener("change", () => {
  studentFields.style.display = "none";
  workField.style.display = "none";

  if (status.value === "student") {
    studentFields.style.display = "flex";
  } else if (status.value === "graduated") {
    studentFields.style.display = "flex";
    workField.style.display = "flex";
  } else if (status.value === "working") {
    workField.style.display = "flex";
  }
});

form.addEventListener("submit", (e) => {
  e.preventDefault();

  const formData = new FormData(form);

  ["college","department","year","company","passout"].forEach(f => {
    if (!formData.get(f)) formData.set(f,"-");
  });

  fetch(scriptURL, {
    method: "POST",
    body: formData
  })
  .then(res => res.json())
  .then(data => {

    const msg = document.getElementById("popupMessage");

    if (data.status === "success") {
      msg.innerText = "✅ Registered Successfully!";
      form.reset();
    } 
    else if (data.status === "duplicate") {
      msg.innerText = "⚠ This email is already registered!";
    } 
    else {
      msg.innerText = "⚠ Something went wrong!";
    }

    document.getElementById("popup").style.display = "flex";
  })
  .catch(() => {
    document.getElementById("popupMessage").innerText = "⚠ Network Error!";
    document.getElementById("popup").style.display = "flex";
  });
});

function closePopup() {
  document.getElementById("popup").style.display = "none";
}
</script>

</body>
</html>
